[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "receipt-renamer"
version = "0.1.0"
description = "Rename batch-scanned receipt images to 'YYYY-MM-DD Business - Purpose.jpg' using a vision LLM."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "receipt-renamer contributors" }]
keywords = ["receipts", "ocr", "llm", "scanner", "expenses"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Utilities",
]
dependencies = [
    "typer>=0.12,<1.0",
    "rich>=13.7,<15",
    "pillow>=10.2,<12",
    "python-dotenv>=1.0,<2",
    "watchdog>=4.0,<7",
]

[project.optional-dependencies]
openai = ["openai>=1.30,<3"]
anthropic = ["anthropic>=0.30,<1"]
heic = ["pillow-heif>=0.16"]
pdf = ["pdf2image>=1.17"]
dev = ["pytest>=8.0,<9"]

[project.scripts]
receipt-renamer = "receipt_renamer.cli:main"

[project.urls]
Homepage = "https://github.com/plaudati/receipt-renamer"

[tool.hatch.build.targets.wheel]
packages = ["src/receipt_renamer"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
